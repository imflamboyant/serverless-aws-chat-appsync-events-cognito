<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Serverless Chat with AppSync Events and Cognito</title>
  <link rel="stylesheet" href="vendor/chat-ui/css/chat.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-topbar">
    <p class="app-topbar__title">Serverless Chat</p>
    <p class="app-topbar__status" id="status" role="status"></p>
    <span class="app-topbar__user" id="current-user"></span>
    <button class="app-button" id="sign-out" type="button">Sign out</button>
  </header>

  <div class="app-main">
    <div class="chat-layout" id="app" data-sidebar="closed">
      <aside class="chat-layout__sidebar">
        <!-- channel items are rendered by app.js from GET /channels -->
        <nav class="chat-channel-list" id="channel-list" aria-label="Channels"></nav>
      </aside>

      <div class="chat-layout__main">
        <header class="chat-channel-header">
          <button class="chat-channel-header__menu" type="button" data-chat-sidebar-toggle aria-label="Toggle channels">☰</button>
          <h1 class="chat-channel-header__name" id="header-name">Loading…</h1>
          <button class="chat-channel-header__meta" id="header-meta" type="button">0 members</button>
        </header>

        <div class="chat-message-list" id="message-list"></div>

        <form class="chat-composer" id="composer">
          <label class="chat-visually-hidden" for="composer-input">Message</label>
          <textarea id="composer-input" class="chat-composer__input" rows="1" placeholder="Message"></textarea>
          <button class="chat-composer__send" type="submit" aria-label="Send message">↑</button>
        </form>
      </div>

      <aside class="chat-layout__aside" hidden></aside>
      <div class="chat-layout__scrim"></div>
    </div>
  </div>

  <script src="vendor/chat-ui/js/chat-ui.js"></script>
  <script src="vendor/chat-ui/js/message-list.js"></script>
  <script src="vendor/chat-ui/js/mentions.js"></script>
  <script src="vendor/chat-ui/js/composer.js"></script>
  <script src="vendor/chat-ui/js/members.js"></script>
  <!-- your copy of config.example.js, filled in with the deploy outputs -->
  <script src="config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
